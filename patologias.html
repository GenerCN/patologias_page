<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Centro Médico San Lucas — Patologías</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/styles.css">
  <!-- Arranca oculta: js/main.js la destapa solo si el usuario tiene acceso
       a Patologías, para que los departamentos clínicos no alcancen a verla. -->
  <style>html.pat-verificando { visibility: hidden; }</style>
  <script>
    document.documentElement.className = 'pat-verificando';
    if (!localStorage.getItem('cmsl_session')) location.replace('login.html');
  </script>
</head>
<body>

<!-- ── HEADER ── -->
<header>
  <a href="index.html" class="btn-back" title="Volver al inicio" aria-label="Volver al inicio">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" style="width:18px;height:18px">
      <path d="M15 19l-7-7 7-7"/>
    </svg>
  </a>
  <img src="img/logo_cmsl.png" alt="Centro Médico San Lucas" class="header-logo">
  <span class="header-subtitle">Patologías</span>
  <div class="header-spacer"></div>
  <div id="status-indicator">
    <span class="dot" id="conn-dot"></span>
    <span id="conn-label">Sin cargar</span>
  </div>
  <button id="btn-logout" class="btn-logout" title="Cerrar sesión">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h6a2 2 0 012 2v1"/>
    </svg>
    Salir
  </button>
</header>

<!-- ── BODY ── -->
<div class="app-body" id="app-body">
  <main>

    <div class="page-head">
      <div>
        <h1>Seguimiento de patologías</h1>
      </div>
    </div>

    <section class="controls-card" aria-label="Búsqueda y filtros">
    <!-- Toolbar -->
    <div class="toolbar">
      <div class="search-wrap">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        <input type="search" id="search-input" placeholder="Folio, expediente o nombre del paciente" autocomplete="off" aria-label="Buscar por folio, expediente o nombre del paciente" aria-describedby="search-kind">
        <span class="search-kind" id="search-kind" aria-live="polite"></span>
      </div>
      <button class="btn btn-primary" id="btn-search">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        Buscar
      </button>
      <button class="btn btn-outline" id="btn-all" title="Volver a cargar los registros">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 11a8 8 0 0 0-14.3-4.9L4 8"/><path d="M4 4v4h4"/><path d="M4 13a8 8 0 0 0 14.3 4.9L20 16"/><path d="M20 20v-4h-4"/>
        </svg>
        Actualizar
      </button>
      <button class="btn btn-new" id="btn-new">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path d="M12 4v16m8-8H4"/>
        </svg>
        Nuevo
      </button>
    </div>

    </section>

    <!-- Etapas (excluyentes) y filtros transversales (Por cobrar, Vencidos); todo se combina -->
    <div id="stats-bar" class="etapas-bar" role="group" aria-label="Filtrar por etapa, cobro y vencimiento" style="display:none"></div>

    <!-- Table card -->
    <div class="table-card">
      <div class="table-scroll">
        <table id="records-table" class="tabla-patologias">
          <thead>
            <tr>
              <th title="Folio / Expediente">Folio · Exp.</th>
              <th title="Nombre del paciente">Paciente</th>
              <th title="Siguiente paso del estudio">Etapa</th>
              <th title="Nivel o tipo de patología">Nivel</th>
              <th title="Fecha de entrega">Entrega</th>
              <th title="Fecha de resultados digitales">Res. digital</th>
              <th id="th-dias" aria-sort="none">
                <button type="button" class="th-sort" id="sort-dias" title="Días naturales entre la entrega y los resultados digitales (límite: 10). Clic para ordenar: más atrasados primero.">
                  Días
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"/></svg>
                </button>
              </th>
              <th title="Fecha de resultados físicos">Res. físico</th>
              <th title="Fecha de revisión médica">Rev. médica</th>
              <th title="¿Requiere cita? y fecha de la cita">Cita</th>
              <th title="Fecha de envío al paciente (o «Vía cita» si ya tiene cita agendada)">Envío</th>
              <th title="Monto">Monto</th>
              <th title="Fecha de pago">Pago</th>
            </tr>
          </thead>
          <tbody id="table-body">
            <tr><td colspan="13">
              <div class="state-box">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                  <path d="M21 21l-4.35-4.35M11 19a8 8 0 100-16 8 8 0 000 16z"/>
                </svg>
                <p>Cargando registros…</p>
              </div>
            </td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Pagination -->
    <div class="pagination" id="pagination" style="display:none"></div>

  </main>

  <!-- ── SIDE PANEL ── -->
  <div id="side-panel">
    <div class="panel-header">
      <div class="panel-header-info">
        <h2 id="panel-title">Editar Registro</h2>
        <p id="panel-subtitle">Folio —</p>
      </div>
      <button id="btn-close-panel" title="Cerrar panel" aria-label="Cerrar panel">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path d="M6 18 18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>
    <div class="panel-alert" id="panel-alert" role="alert" hidden></div>
    <div class="panel-body"></div>
    <div class="panel-confirm" id="panel-confirm" hidden>
      <p>Tienes cambios sin guardar.</p>
      <div class="panel-confirm-actions">
        <button type="button" class="btn btn-cancel" id="btn-keep-editing">Seguir editando</button>
        <button type="button" class="btn btn-discard" id="btn-discard-changes">Descartar cambios</button>
      </div>
    </div>
    <div class="panel-footer" id="panel-footer">
      <button class="btn btn-cancel" id="btn-cancel-edit">Cancelar</button>
      <button class="btn btn-save" id="btn-save-edit">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" style="width:14px;height:14px">
          <path d="M5 13l4 4L19 7"/>
        </svg>
        Guardar cambios
      </button>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast"></div>

<script type="module" src="js/main.js"></script>
<script type="module">
  import { logout } from './js/auth.js';
  document.getElementById('btn-logout').addEventListener('click', logout);
</script>
</body>
</html>
